<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caisse Enregistreuse</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }

    .game-card {
      background: #1e293b;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      max-width: 850px;
      width: 100%;
      position: relative;
    }

    /* LAYOUT À DEUX COLONNES */
    .register-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 15px;
    }

    /* ÉCRAN DE CAISSE ÉPURÉ ET COMPACT */
    .register-screen {
      background: #021a12;
      border: 4px solid #064e3b;
      border-radius: 12px;
      padding: 12px 15px;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9), 0 0 10px rgba(16, 185, 129, 0.2);
      font-family: 'VT323', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .screen-line {
      font-size: 2.8rem;
      font-weight: bold;
      color: #34d399;
      text-shadow: 0 0 12px rgba(52, 211, 153, 0.8);
      line-height: 1;
      letter-spacing: 1px;
    }

    .screen-label {
      color: #10b981;
      text-shadow: 0 0 5px rgba(16, 185, 129, 0.5);
    }

    /* DROITE: ARGENT REÇU (PADDINGS ET MARGES RÉDUITS) */
    .customer-area {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
    }

    .customer-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .visual-cash-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      align-content: flex-start;
      flex-grow: 1;
      min-height: 75px;
      background: #1e293b;
      padding: 8px;
      border-radius: 8px;
      border: 1px dashed #475569;
    }

    /* MONNAIE À RENDRE ET BOUTON RENDRE DANS LE MÊME CADRE */
    .given-section {
      background: #0f172a;
      border: 2px solid #334155;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .given-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .btn-submit-inline {
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-submit-inline:hover {
      background: #15803d;
    }

    .btn-submit-inline:active {
      transform: scale(0.96);
    }

    .tray-section-title {
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    .tray {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      background: #0f172a;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .cash-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      user-select: none;
      box-sizing: border-box;
      position: relative;
    }

    .real-note {
      width: 110px;
      height: 58px;
      border-radius: 5px;
      border: 2px solid #0f172a;
      overflow: hidden;
      flex-shrink: 0;
    }

    .real-note-50 { background-color: #d97706; }
    .real-note-20 { background-color: #2563eb; }
    .real-note-10 { background-color: #dc2626; }
    .real-note-5  { background-color: #4b5563; }

    .note-content {
      width: calc(100% - 6px);
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3px 5px;
      box-sizing: border-box;
      color: #ffffff;
      background-color: inherit;
    }

    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.5rem;
      font-weight: bold;
      background-color: rgba(0, 0, 0, 0.25);
      padding: 1px 3px;
      border-radius: 2px;
    }

    .note-body {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .note-val-large {
      font-size: 1.5rem;
      font-family: 'Arial Black', sans-serif;
      font-weight: 900;
      line-height: 0.9;
      color: #ffffff;
    }

    .note-arch {
      width: 22px;
      height: 25px;
      background-color: #ffffff;
      border-radius: 10px 10px 0 0;
      border: 1.5px solid #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      font-size: 0.5rem;
      font-weight: bold;
    }

    .note-band {
      width: 6px;
      height: 100%;
      background-color: #fbbf24;
      border-left: 1px solid #0f172a;
      position: absolute;
      right: 0;
      top: 0;
    }

    .coin {
      border-radius: 50%;
      color: #0f172a;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .coin-200 { width: 44px; height: 44px; font-size: 0.85rem; background: #e2e8f0; border: 3px solid #d97706; }
    .coin-100 { width: 40px; height: 40px; font-size: 0.8rem; background: #d97706; border: 3px solid #cbd5e0; }
    
    .coin-gold { background: #f59e0b; border: 2px solid #b45309; color: #78350f; }
    .coin-50  { width: 38px; height: 38px; font-size: 0.8rem; }
    .coin-20  { width: 35px; height: 35px; font-size: 0.75rem; }
    .coin-10  { width: 32px; height: 32px; font-size: 0.7rem; }
    
    .coin-copper { background: #ea580c; color: #ffffff; border: 2px solid #9a3412; }
    .coin-5   { width: 32px; height: 32px; font-size: 0.7rem; }
    .coin-2   { width: 28px; height: 28px; font-size: 0.65rem; }
    .coin-1   { width: 25px; height: 25px; font-size: 0.6rem; }

    .btn-cash {
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.1s ease;
    }
    .btn-cash:hover {
      filter: brightness(1.2);
      transform: translateY(-2px);
    }
    .btn-cash:active {
      transform: scale(0.92);
    }

    .removable:hover {
      filter: brightness(0.8);
      outline: 2px solid #ef4444;
      border-radius: 6px;
    }

    /* MODALE / POPUP DE RÉSULTAT */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 999;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #1e293b;
      border: 2px solid #334155;
      padding: 25px 30px;
      border-radius: 16px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      transform: scale(0.9);
      transition: transform 0.25s ease;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .modal-msg {
      font-size: 1rem;
      color: #cbd5e1;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .modal-stats {
      display: flex;
      justify-content: space-around;
      background: #0f172a;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: bold;
    }

    .stat-val {
      font-size: 1.3rem;
      font-weight: bold;
    }

    .stat-val.success { color: #4ade80; }
    .stat-val.error { color: #f87171; }

    .modal-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      background: #38bdf8;
      color: #0f172a;
      transition: background 0.2s, transform 0.1s;
    }

    .modal-btn:hover {
      background: #0284c7;
      color: white;
    }

    @media (max-width: 650px) {
      .register-container {
        grid-template-columns: 1fr;
      }
      .screen-line {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>

<div class="game-card">

  <div class="register-container">
    
    <div class="register-screen">
      <div class="screen-line"><span class="screen-label">Total </span><span id="item-cost">0,00 €</span></div>
    </div>

    <div class="customer-area">
      <div class="customer-title">✋ Donné par le client :</div>
      <div id="customer-paid-visual" class="visual-cash-container"></div>
    </div>

  </div>

  <div class="given-section">
    <div class="given-header">
      <span>Monnaie à rendre : <span id="user-total" style="color: #38bdf8;">0,00 €</span></span>
      <button class="btn-submit-inline" onclick="checkAnswer()">Rendre</button>
    </div>
    <div id="user-given-visual" class="visual-cash-container" style="min-height: 60px; background: #0f172a;"></div>
  </div>

  <div class="tray-section-title">Cliquez pour donner la monnaie :</div>
  <div class="tray" id="tray"></div>

</div>

<div class="modal-overlay" id="result-modal">
  <div class="modal-card">
    <div class="modal-icon" id="modal-icon">🎉</div>
    <div class="modal-title" id="modal-title">Bravo !</div>
    <div class="modal-msg" id="modal-msg">Vous avez rendu la bonne monnaie.</div>
    
    <div class="modal-stats">
      <div class="stat-box">
        <span class="stat-label">Réussis (1er coup)</span>
        <span class="stat-val success" id="popup-correct">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Erreurs</span>
        <span class="stat-val error" id="popup-errors">0</span>
      </div>
    </div>

    <button class="modal-btn" id="modal-btn" onclick="closeModal()">Client suivant</button>
  </div>
</div>

<script>
  let itemCost = 0;
  let customerPaid = 0;
  let userGiven = 0;
  let userGivenItems = [];
  
  let scoreCorrect = 0;
  let scoreErrors = 0;
  let isFirstAttempt = true;
  let isSuccess = false;

  const denominations = [
    { name: '50 €', value: 50.00, type: 'note', class: 'real-note-50', valStr: '50' },
    { name: '20 €', value: 20.00, type: 'note', class: 'real-note-20', valStr: '20' },
    { name: '10 €', value: 10.00, type: 'note', class: 'real-note-10', valStr: '10' },
    { name: '5 €',  value: 5.00,  type: 'note', class: 'real-note-5',  valStr: '5' },
    { name: '2 €',  value: 2.00,  type: 'coin', class: 'coin coin-200' },
    { name: '1 €',  value: 1.00,  type: 'coin', class: 'coin coin-100' },
    { name: '50c',  value: 0.50,  type: 'coin', class: 'coin coin-gold coin-50' },
    { name: '20c',  value: 0.20,  type: 'coin', class: 'coin coin-gold coin-20' },
    { name: '10c',  value: 0.10,  type: 'coin', class: 'coin coin-gold coin-10' },
    { name: '5c',   value: 0.05,  type: 'coin', class: 'coin coin-copper coin-5' },
    { name: '2c',   value: 0.02,  type: 'coin', class: 'coin coin-copper coin-2' },
    { name: '1c',   value: 0.01,  type: 'coin', class: 'coin coin-copper coin-1' }
  ];

  function formatEuro(amount) {
    return amount.toFixed(2).replace('.', ',') + ' €';
  }

  function createCashElement(item) {
    const el = document.createElement('div');
    if (item.type === 'note') {
      el.className = `cash-item real-note ${item.class}`;
      el.innerHTML = `
        <div class="note-content">
          <div class="note-header">
            <span>BCE EKP</span>
            <span>EURO</span>
          </div>
          <div class="note-body">
            <span class="note-val-large">${item.valStr}</span>
            <div class="note-arch">🏛️</div>
          </div>
        </div>
        <div class="note-band"></div>
      `;
    } else {
      el.className = `cash-item ${item.class}`;
      el.innerText = item.name;
    }
    el.title = item.name;
    return el;
  }

  function renderTray() {
    const tray = document.getElementById('tray');
    tray.innerHTML = '';
    denominations.forEach(d => {
      const btn = createCashElement(d);
      btn.classList.add('btn-cash');
      btn.onclick = () => addMoney(d);
      tray.appendChild(btn);
    });
  }

  function newTransaction() {
    userGiven = 0;
    userGivenItems = [];
    isFirstAttempt = true;
    updateUserDisplay();

    itemCost = Math.round((Math.random() * 44.9 + 0.10) * 100) / 100;
    
    const payment = generateStrictRealisticPayment(itemCost);
    customerPaid = payment.total;

    document.getElementById('item-cost').innerText = formatEuro(itemCost);
    renderCustomerPayment(payment.items);
  }

  function generateStrictRealisticPayment(cost) {
    const options = [];

    [5, 10, 20, 50].forEach(val => {
      if (val >= cost) options.push([getDenom(val)]);
    });

    let strictNotes = getMinimalNotesFor(cost);
    if (strictNotes.length > 0) options.push(strictNotes);

    let cents = Math.round((cost - Math.floor(cost)) * 100);
    if (cents > 0) {
      let baseCost = Math.floor(cost);
      let baseNotes = getMinimalNotesFor(baseCost);
      let baseSum = baseNotes.reduce((a, b) => a + b.value, 0);

      if (baseSum <= cost && baseSum > 0) {
        [0.50, 1.00, 2.00].forEach(addVal => {
          if (baseSum + addVal >= cost) {
            options.push([...baseNotes, getDenom(addVal)]);
          }
        });
      }
    }

    const validOptions = options.filter(opt => {
      let tot = opt.reduce((sum, item) => sum + item.value, 0);
      return tot >= cost;
    });

    const selectedItems = validOptions[Math.floor(Math.random() * validOptions.length)];
    const total = Math.round(selectedItems.reduce((sum, item) => sum + item.value, 0) * 100) / 100;

    return { total: total, items: selectedItems };
  }

  function getMinimalNotesFor(amount) {
    if (amount <= 0) return [];
    let combo = [];
    let rem = amount;
    [50, 20, 10, 5].forEach(val => {
      while (rem >= val) {
        combo.push(getDenom(val));
        rem -= val;
      }
    });
    if (rem > 0 && combo.reduce((a,b)=>a+b.value,0) < amount) {
      let currentSum = combo.reduce((a,b)=>a+b.value,0);
      let diff = amount - currentSum;
      let nextNote = [5, 10, 20, 50].find(v => v >= diff);
      if (nextNote) combo.push(getDenom(nextNote));
    }
    return combo;
  }

  function getDenom(value) {
    return denominations.find(d => Math.abs(d.value - value) < 0.001);
  }

  function renderCustomerPayment(items) {
    const container = document.getElementById('customer-paid-visual');
    container.innerHTML = '';
    items.forEach(item => {
      container.appendChild(createCashElement(item));
    });
  }

  function addMoney(item) {
    userGiven = Math.round((userGiven + item.value) * 100) / 100;
    userGivenItems.push(item);
    updateUserDisplay();
  }

  function removeMoney(index) {
    const removedItem = userGivenItems.splice(index, 1)[0];
    userGiven = Math.round((userGiven - removedItem.value) * 100) / 100;
    if (userGiven < 0) userGiven = 0;
    updateUserDisplay();
  }

  function updateUserDisplay() {
    document.getElementById('user-total').innerText = formatEuro(userGiven);
    const container = document.getElementById('user-given-visual');
    container.innerHTML = '';
    
    userGivenItems.forEach((item, index) => {
      const el = createCashElement(item);
      el.classList.add('btn-cash', 'removable');
      el.onclick = () => removeMoney(index);
      container.appendChild(el);
    });
  }

  function checkAnswer() {
    const correctChange = Math.round((customerPaid - itemCost) * 100) / 100;
    const diff = Math.round((userGiven - correctChange) * 100) / 100;

    const iconEl = document.getElementById('modal-icon');
    const titleEl = document.getElementById('modal-title');
    const msgEl = document.getElementById('modal-msg');
    const btnEl = document.getElementById('modal-btn');

    if (Math.abs(diff) < 0.001) {
      isSuccess = true;
      iconEl.innerText = '🎉';
      titleEl.innerText = 'C\'est exact !';
      titleEl.style.color = '#4ade80';
      msgEl.innerText = `Excellente gestion. Vous avez rendu exactement ${formatEuro(correctChange)}.`;
      btnEl.innerText = 'Client suivant';

      if (isFirstAttempt) {
        scoreCorrect++;
      }
    } else {
      isSuccess = false;
      iconEl.innerText = '⚠️';
      titleEl.innerText = 'Oups, erreur !';
      titleEl.style.color = '#f87171';
      
      if (diff > 0) {
        msgEl.innerText = `Trop rendu ! Vous avez donné ${formatEuro(userGiven)} au lieu de ${formatEuro(correctChange)} (retirez ${formatEuro(diff)}).`;
      } else {
        msgEl.innerText = `Pas assez rendu ! Vous avez donné ${formatEuro(userGiven)} au lieu de ${formatEuro(correctChange)} (rajoutez ${formatEuro(Math.abs(diff))}).`;
      }
      btnEl.innerText = 'Réessayer';

      if (isFirstAttempt) {
        scoreErrors++;
        isFirstAttempt = false;
      }
    }

    document.getElementById('popup-correct').innerText = scoreCorrect;
    document.getElementById('popup-errors').innerText = scoreErrors;

    document.getElementById('result-modal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('result-modal').classList.remove('active');
    if (isSuccess) {
      newTransaction();
    }
  }

  renderTray();
  newTransaction();
</script>

</body>
</html>
